services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: crab
      POSTGRES_PASSWORD: crab
      POSTGRES_DB: crabcrawler
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crab -d crabcrawler"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
