[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/crawler",
    "crates/processing",
    "crates/persistence",
    "crates/ingest",
    "crates/api",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
# crates internos
crab-domain = { path = "crates/domain" }
crab-crawler = { path = "crates/crawler" }
crab-processing = { path = "crates/processing" }
crab-persistence = { path = "crates/persistence" }
crab-api = { path = "crates/api" }
crab-ingest = { path = "crates/ingest" }

# externos
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
calamine = "0.36"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono", "uuid", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
url = "2"
quick-xml = "0.41"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
